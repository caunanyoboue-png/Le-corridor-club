version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: maquis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maquis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maquis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-maquis_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maquis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
